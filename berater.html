<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DEGAJA – Berater-Bereich</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f4ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#18334a}
  .card{max-width:360px;width:100%;margin:20px;padding:32px 24px;background:#fff;border-radius:24px;box-shadow:0 16px 45px rgba(31,65,95,.12);text-align:center;box-sizing:border-box}
  h1{font-size:20px;margin:0 0 24px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
  .dot.on{background:#3f9e6a}
  .dot.off{background:#c7cdd6}
  .status-line{font-weight:800;font-size:16px;margin-bottom:24px}
  input{width:100%;box-sizing:border-box;border:1px solid #d7e0e6;border-radius:12px;padding:16px;font-size:20px;text-align:center;letter-spacing:.2em;margin-bottom:12px}
  button{width:100%;box-sizing:border-box;border:0;border-radius:999px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;margin-bottom:12px}
  .go-on{background:#3f9e6a;color:#fff}
  .go-off{background:#eceff2;color:#48566a}
  .login{background:#18334a;color:#fff}
  .msg{font-size:13px;color:#8a91a0;min-height:18px;margin-top:8px}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <h1>DEGAJA – Berater-Bereich</h1>

    <div id="loginView">
      <input id="pinInput" inputmode="numeric" maxlength="6" placeholder="Code eingeben">
      <button class="login" id="loginBtn">Einloggen</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="statusView" class="hidden">
      <div class="status-line"><span class="dot off" id="dot"></span><span id="statusText">…</span></div>
      <button class="go-on" id="btnOn">Ich bin jetzt verfügbar</button>
      <button class="go-off" id="btnOff">Nicht verfügbar</button>
      <div class="msg" id="msg"></div>
      <div id="incomingCall" class="hidden" style="margin-top:20px;padding:18px;border-radius:16px;background:#fff6e5;border:1px solid #f0d9a8">
        <div style="font-weight:800;margin-bottom:10px">📞 Eingehender Anruf</div>
        <a id="incomingJoinBtn" href="#" style="display:block;background:#18334a;color:#fff;border-radius:999px;padding:14px;font-weight:800;text-decoration:none">Anruf annehmen</a>
      </div>
    </div>
  </div>
<script>
(function(){
  var id = 'papuli';
  var STORE_KEY = 'degajaBeraterPin';
  var loginView = document.getElementById('loginView'), statusView = document.getElementById('statusView'),
      pinInput = document.getElementById('pinInput'), loginBtn = document.getElementById('loginBtn'), loginMsg = document.getElementById('loginMsg'),
      dot = document.getElementById('dot'), statusText = document.getElementById('statusText'), msg = document.getElementById('msg'),
      btnOn = document.getElementById('btnOn'), btnOff = document.getElementById('btnOff');

  function getPin() { try { return localStorage.getItem(STORE_KEY) || ''; } catch (_) { return ''; } }
  function setPin(v) { try { localStorage.setItem(STORE_KEY, v); } catch (_) {} }
  function clearPin() { try { localStorage.removeItem(STORE_KEY); } catch (_) {} }

  function render(available) {
    dot.className = 'dot ' + (available ? 'on' : 'off');
    statusText.textContent = available ? 'Live verfügbar' : 'Nicht verfügbar';
  }

  function refresh() {
    fetch('/api/advisor-availability')
      .then(function (r) { return r.json(); })
      .then(function (d) { render(!!(d.available && d.available[id])); })
      .catch(function () {});
  }

  function set(available, pin) {
    msg.textContent = '…';
    fetch('/api/advisor-availability', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ advisorId: id, token: pin, available: available })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (res.ok && res.d.ok) { render(available); msg.textContent = 'Gespeichert.'; }
        else if (res.d.error === 'Invalid token') { clearPin(); showLogin('Falscher Code. Bitte erneut eingeben.'); }
        else { msg.textContent = 'Fehler: ' + (res.d.error || ''); }
      })
      .catch(function () { msg.textContent = 'Netzwerkfehler.'; });
  }

  var incomingCall = document.getElementById('incomingCall'), incomingJoinBtn = document.getElementById('incomingJoinBtn');
  var lastSeenCode = '', pollTimer = null, ringTimer = null;

  function playRing() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
      var ctx = new Ctx();
      var beep = function () {
        var osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
      };
      beep();
      var count = 0;
      ringTimer = setInterval(function () { count++; if (count >= 10) { clearInterval(ringTimer); return; } beep(); }, 600);
    } catch (_) {}
  }

  function stopRing() { if (ringTimer) { clearInterval(ringTimer); ringTimer = null; } }

  function pollPending() {
    fetch('/api/pending-session?advisorId=' + id)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var p = d && d.pending;
        if (p && p.code && p.code !== lastSeenCode) {
          lastSeenCode = p.code;
          incomingCall.classList.remove('hidden');
          incomingJoinBtn.href = p.link || ('/?advisor_join=' + p.code + '#human');
          playRing();
        } else if (!p) {
          incomingCall.classList.add('hidden');
          stopRing();
        }
      })
      .catch(function () {});
  }

  incomingJoinBtn.addEventListener('click', stopRing);

  function showStatus() {
    loginView.classList.add('hidden');
    statusView.classList.remove('hidden');
    refresh();
    pollPending();
    pollTimer = setInterval(pollPending, 4000);
  }

  function showLogin(message) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    stopRing();
    statusView.classList.add('hidden');
    loginView.classList.remove('hidden');
    loginMsg.textContent = message || '';
    pinInput.value = '';
    pinInput.focus();
  }

  loginBtn.onclick = function () {
    var pin = pinInput.value.trim();
    if (!pin) { loginMsg.textContent = 'Code eingeben.'; return; }
    setPin(pin);
    showStatus();
  };
  pinInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') loginBtn.click(); });

  btnOn.onclick = function () { set(true, getPin()); };
  btnOff.onclick = function () { set(false, getPin()); };

  var stored = getPin();
  if (stored) showStatus(); else showLogin();
})();
</script>
</body>
</html>
