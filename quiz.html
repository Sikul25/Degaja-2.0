    }
    nextBtn.addEventListener("click", tryNext);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryNext(); });
    document.getElementById("backBtn").addEventListener("click", goBack);
  }

  function goBack(){
    if (step > 1) { step -= 1; render(); }
  }

  function render(){
    delete card.dataset.locked;
    document.documentElement.lang = lang;
    updateProgress();
    if (step === 1) {
      renderOptionsStep(t().q1_eyebrow, t().q1_h1, t().q1_opts, function(opt){
        answers.insight = opt.t;
        step = 2; render();
      });
    } else if (step === 2) {
      renderInputStep(t().q2_eyebrow, t().q2_h1, t().q2_placeholder, "date", function(val){
        answers.birthdate = val;
        step = 3; render();
      }, answers.birthdate, isAdultBirthDate, t().birthdate_error);
    } else if (step === 3) {
      renderInputStep(t().q3_eyebrow, t().q3_h1, t().q3_placeholder, "text", function(val){
        answers.name = val;
        step = 4; render();
      }, answers.name);
    } else if (step === 4) {
      renderOptionsStep(t().q4_eyebrow, t().q4_h1, t().q4_opts, function(opt){
        answers.focus = opt.t;
        step = 5; render();
      });
    } else if (step === 5) {
      renderPhotoStep();
    }
  }

  function resizeImage(file, maxDim, quality, callback){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale);
        var h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = function(){ callback(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ callback(null); };
    reader.readAsDataURL(file);
  }

  function renderPhotoStep(){
    var html = '<div class="quiz-eyebrow">' + t().q5_eyebrow + '</div>';
    html += '<h1 class="quiz-h1">' + t().q5_h1 + '</h1>';
    html += '<p class="quiz-photo-sub">' + t().q5_sub + '</p>';
    html += '<input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">';
    html += '<div class="quiz-dropzone' + (answers.palmImage ? ' has-img' : '') + '" id="dropzone">';
    if (answers.palmImage) {
      html += '<img src="' + answers.palmImage + '" alt="">';
    } else {
      html += '<div class="icon">🖐️</div><div class="label">' + t().photo_upload + '</div><div class="hint">' + t().photo_hint + '</div>';
    }
    html += '</div>';
    html += '<div id="photoError" style="display:none;color:#e35b5b;font-size:13px;margin-top:8px;text-align:center">' + escapeHtml(t().photo_error) + '</div>';
    if (answers.palmImage) {
      html += '<button class="quiz-cta" id="continuePhotoBtn">' + t().photo_continue + '</button>';
    }
    html += '<button class="quiz-skip" id="skipBtn">' + t().photo_skip + '</button>';
    html += '<button class="quiz-back" id="backBtn">' + t().back + '</button>';
    setCard(html);

    var input = document.getElementById("photoInput");
    var photoError = document.getElementById("photoError");
    document.getElementById("dropzone").addEventListener("click", function(){ input.click(); });
    input.addEventListener("change", function(){
      var file = input.files && input.files[0];
      if (!file) return;
      if (photoError) photoError.style.display = "none";
      resizeImage(file, 900, 0.82, function(dataUrl){
        if (!dataUrl) {
          // The photo failed to decode/process (corrupt file, unsupported
          // format) — tell the visitor instead of leaving the screen looking
          // frozen, and reset the input so re-picking the same file retries.
          input.value = "";
          if (photoError) photoError.style.display = "block";
          return;
        }
        answers.palmImage = dataUrl;
        answers.palmMediaType = "image/jpeg";
        render();
      });
    });
    var continueBtn = document.getElementById("continuePhotoBtn");
    if (continueBtn) continueBtn.addEventListener("click", function(){ runReveal(); });
    document.getElementById("skipBtn").addEventListener("click", function(){
      answers.palmImage = null;
      runReveal();
    });
    document.getElementById("backBtn").addEventListener("click", goBack);
  }

  function renderLoading(phrases){
    phrases = phrases || t().loading_phrases;
    var html = '<div class="quiz-loading">';
    html += '<div class="quiz-hourglass-wrap"><span class="quiz-hourglass">⏳</span></div>';
    html += '<div class="quiz-loading-pct" id="loadPct">0%</div>';
    html += '<div><div class="quiz-loading-title" id="loadTitle">' + phrases[0] + '</div>';
    html += '<div class="quiz-loading-sub">' + t().loading_sub + '</div></div>';
    html += '</div>';
    setCard(html);

    var pctEl = document.getElementById("loadPct");
    var titleEl = document.getElementById("loadTitle");
    var pct = 0, phraseIdx = 0;
    clearInterval(loadingTimer);
    loadingTimer = setInterval(function(){
      pct = Math.min(96, pct + Math.round(4 + Math.random() * 9));
      pctEl.textContent = pct + "%";
      var nextPhrase = Math.floor(pct / (100 / phrases.length));
      if (nextPhrase !== phraseIdx && nextPhrase < phrases.length) {
        phraseIdx = nextPhrase;
        titleEl.style.opacity = 0;
        setTimeout(function(){ titleEl.textContent = phrases[phraseIdx]; titleEl.style.opacity = 1; }, 220);
      }
    }, 260);
  }

  function typewriter(el, text, done){
    clearInterval(typeTimer);
    var i = 0;
    el.innerHTML = '<span class="cursor"></span>';
    typeTimer = setInterval(function(){
      i += 2;
      el.innerHTML = escapeHtml(text.slice(0, i)) + '<span class="cursor"></span>';
      if (i >= text.length) {
        clearInterval(typeTimer);
        el.innerHTML = escapeHtml(text);
        if (done) done();
      }
    }, 18);
  }

  var revealAudio = null;
  var lastQuestion = "";
  var lastTopic = "";

  function loadVoice(text, btn){
    btn.disabled = true;
    btn.textContent = t().voice_loading;
    fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, lang: lang })
    }).then(function(r){ return r.ok ? r.blob() : null; }).then(function(blob){
      if (!blob) { btn.style.display = "none"; return; }
      var url = URL.createObjectURL(blob);
      revealAudio = new Audio(url);
      btn.disabled = false;
      btn.textContent = t().voice_listen;
      revealAudio.addEventListener("ended", function(){
        btn.classList.remove("playing");
        btn.textContent = t().voice_listen;
      });
      btn.addEventListener("click", function(){
        if (revealAudio.paused) {
          revealAudio.play();
          btn.classList.add("playing");
          btn.textContent = t().voice_playing;
        } else {
          revealAudio.pause();
          btn.classList.remove("playing");
          btn.textContent = t().voice_listen;
        }
      });
    }).catch(function(){ btn.style.display = "none"; });
  }

  // Guards against a fast double-tap on a price button firing two concurrent
  // /api/checkout calls (two live Stripe sessions before the first redirect).
  var checkoutInFlight = false;

  function startQuizCheckout(product){
    if (checkoutInFlight) return;
    checkoutInFlight = true;
    try {
      localStorage.setItem("degajaPendingReading", JSON.stringify({ question: lastQuestion, topic: lastTopic }));
    } catch (_) {}
    fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product: product, birthDate: answers.birthdate, lang: lang, ref: ref })
    }).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(result){
      if (!result.ok || !result.data.url) throw new Error("checkout failed");
      window.location.href = result.data.url;
    }).catch(function(){
      checkoutInFlight = false;
      alert(t().purchase_error);
    });
  }

  function openPurchaseModal(){
    var overlay = document.createElement("div");
    overlay.className = "quiz-modal-overlay";
    overlay.innerHTML =
      '<div class="quiz-modal">' +
        '<div class="eyebrow">' + t().purchase_eyebrow + '</div>' +
        '<h2>' + t().purchase_title + '</h2>' +
        '<p>' + t().purchase_desc + '</p>' +
        '<button class="quiz-modal-btn" id="pmSingle">' + t().purchase_single + '</button>' +
        '<button class="quiz-modal-btn" id="pmPack">' + t().purchase_pack + '</button>' +
        '<div class="quiz-modal-note">' + t().purchase_note + '</div>' +
        '<button class="quiz-modal-close" id="pmClose">' + t().purchase_back + '</button>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    document.getElementById("pmClose").addEventListener("click", function(){ overlay.remove(); });
    document.getElementById("pmSingle").addEventListener("click", function(){ startQuizCheckout("single"); });
    document.getElementById("pmPack").addEventListener("click", function(){ startQuizCheckout("pack"); });
  }

  function legalLinksHtml(){
    var l = t().legal || {};
    return '<div class="quiz-legal-links">' +
      '<a href="impressum.html" target="_blank" rel="noopener">' + (l.impressum || "Impressum") + '</a> · ' +
      '<a href="datenschutz.html" target="_blank" rel="noopener">' + (l.datenschutz || "Datenschutz") + '</a> · ' +
      '<a href="agb.html" target="_blank" rel="noopener">' + (l.agb || "AGB") + '</a> · ' +
      '<a href="widerruf.html" target="_blank" rel="noopener">' + (l.widerruf || "Widerruf") + '</a>' +
      '</div>';
  }

  function renderReveal(text){
    var html = '<div class="quiz-reveal-top"><div class="quiz-reveal-badge">' + t().reveal_badge + '</div>';
    html += '<button class="quiz-voice-btn" id="voiceBtn" disabled>' + t().voice_loading + '</button></div>';
    html += '<div class="quiz-reveal-card"><div class="quiz-reveal-text" id="revealText"></div></div>';
    html += '<button class="quiz-cta" id="ctaBtn">' + t().cta + '</button>';
    html += '<div class="quiz-pack-hint" role="button" tabindex="0">' + t().purchase_pack + '</div>';
    html += '<div class="quiz-trust-note">🔒 ' + t().purchase_note + '</div>';
    html += '<div class="quiz-disclaimer">' + t().disclaimer + '</div>';
    html += legalLinksHtml();
    setCard(html);
    typewriter(document.getElementById("revealText"), text);
    loadVoice(text, document.getElementById("voiceBtn"));
    document.getElementById("ctaBtn").addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    // The pack price below the button looked clickable (price, bold, gold)
    // but previously did nothing when tapped — route it to the same modal.
    var packHint = document.querySelector(".quiz-pack-hint");
    packHint.addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    packHint.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (revealAudio) revealAudio.pause(); openPurchaseModal(); }
    });
  }

  // palm.js replies as a sequence of "**Label:** body" sections (labels
  // already translated server-side) — split on that marker generically so
  // this works for either language without hardcoding label text.
  function splitPalmSections(text){
    var parts = text.split(/\*\*(.+?):\*\*/);
    var sections = [];
    for (var i = 1; i < parts.length; i += 2) {
      var body = (parts[i + 1] || "").trim();
      if (body) sections.push({ label: parts[i].trim(), body: body });
    }
    return sections.length ? sections : [{ label: "", body: text }];
  }

  function renderPalmReveal(text){
    var sections = splitPalmSections(text);
    var html = '<div class="quiz-reveal-top"><div class="quiz-reveal-badge">' + t().palm_badge + '</div>';
    html += '<button class="quiz-voice-btn" id="voiceBtn" disabled>' + t().voice_loading + '</button></div>';
    sections.forEach(function(s, i){
      html += '<div class="quiz-palm-section" style="animation-delay:' + (i * 0.12) + 's">';
      if (s.label) html += '<h3>' + escapeHtml(s.label) + '</h3>';
      html += '<p>' + escapeHtml(s.body) + '</p></div>';
    });
    html += '<button class="quiz-cta" id="ctaBtn">' + t().cta + '</button>';
    html += '<div class="quiz-pack-hint" role="button" tabindex="0">' + t().purchase_pack + '</div>';
    html += '<div class="quiz-trust-note">🔒 ' + t().purchase_note + '</div>';
    html += '<div class="quiz-disclaimer">' + t().disclaimer + '</div>';
    html += legalLinksHtml();
    setCard(html);
    loadVoice(sections[0].body, document.getElementById("voiceBtn"));
    document.getElementById("ctaBtn").addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    // The pack price below the button looked clickable (price, bold, gold)
    // but previously did nothing when tapped — route it to the same modal.
    var packHint = document.querySelector(".quiz-pack-hint");
    packHint.addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    packHint.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (revealAudio) revealAudio.pause(); openPurchaseModal(); }
    });
  }

  function finishLoadingBar(){
    clearInterval(loadingTimer);
    var pctEl = document.getElementById("loadPct");
    if (pctEl) pctEl.textContent = "100%";
  }

  function runReveal(){
    updateProgress(100);

    if (answers.palmImage) {
      lastQuestion = answers.insight || "";
      lastTopic = REVEAL_TOPIC[lang];
      renderLoading(t().loading_phrases_palm);
      var minWaitPalm = new Promise(function(resolve){ setTimeout(resolve, 3600); });
      var palmRequest = fetch("/api/palm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: answers.palmImage,
          mediaType: answers.palmMediaType || "image/jpeg",
          lang: lang,
          profile: {
            name: answers.name,
            birthDate: answers.birthdate,
            focus: answers.focus,
            bigQuestion: answers.insight
          }
        })
      }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

      Promise.all([palmRequest, minWaitPalm]).then(function(results){
        finishLoadingBar();
        var data = results[0];
        var text = (data && data.text) ? data.text : t().palm_fallback;
        setTimeout(function(){ renderPalmReveal(text); }, 260);
      });
      return;
    }

    renderLoading(t().loading_phrases);
    var question = REVEAL_PROMPT[lang]
      .replace("{name}", answers.name)
      .replace("{birthdate}", answers.birthdate)
      .replace("{insight}", answers.insight)
      .replace("{focus}", answers.focus);
    lastQuestion = question;
    lastTopic = REVEAL_TOPIC[lang];

    var minWait = new Promise(function(resolve){ setTimeout(resolve, 3200); });
    var request = fetch("/api/oracle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        topic: REVEAL_TOPIC[lang],
        mode: "paid",
        lang: lang
      })
    }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

    Promise.all([request, minWait]).then(function(results){
      finishLoadingBar();
      var data = results[0];
      var text = (data && data.text) ? data.text : t().reveal_fallback;
      setTimeout(function(){ renderReveal(text); }, 260);
    });
  }

  render();
  applyGeoLangIfEligible();
})();
</script>
