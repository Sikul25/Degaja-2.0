<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>DEGAJA – CCBill test (internal)</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f4ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#18334a}
  .card{max-width:560px;width:100%;margin:20px;padding:32px 24px;background:#fff;border-radius:24px;box-shadow:0 16px 45px rgba(31,65,95,.12);box-sizing:border-box}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#596273;font-size:14px;line-height:1.5}
  button{width:100%;box-sizing:border-box;border:0;border-radius:999px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;margin:16px 0;background:#18334a;color:#fff}
  button:disabled{opacity:.5;cursor:default}
  .status{font-size:13px;padding:12px;border-radius:12px;background:#f6f9fb;white-space:pre-wrap;word-break:break-all;margin-top:12px}
  .status.ok{background:#e9f7ee;color:#1f6b3f}
  .status.err{background:#fdecec;color:#9b2c2c}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <h1>CCBill integration test (internal, not linked anywhere)</h1>
    <p>Runs one real $3.00 USD test charge through the real CCBill FlexForm, using the exact price/period CCBill's own worked example used. Does not touch the live site's real checkout (Stripe stays live for all real visitors).</p>
    <button id="startBtn">Run $3 test payment</button>
    <div id="status" class="status hidden"></div>
  </div>
<script>
(function(){
  var ORDER_KEY = 'degajaCcbillTestOrderId';
  var startBtn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');

  function showStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
    statusEl.classList.remove('hidden');
  }

  startBtn.addEventListener('click', function () {
    startBtn.disabled = true;
    showStatus('Starting checkout…');
    fetch('/api/ccbill-checkout-test', { method: 'POST' })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok || !res.d.url) {
          showStatus('Error: ' + (res.d.error || 'unknown'), 'err');
          startBtn.disabled = false;
          return;
        }
        try { localStorage.setItem(ORDER_KEY, res.d.orderId); } catch (_) {}
        window.location.href = res.d.url;
      })
      .catch(function (e) {
        showStatus('Network error: ' + e, 'err');
        startBtn.disabled = false;
      });
  });

  function poll(orderId, attemptsLeft) {
    fetch('/api/verify-ccbill-payment?order_id=' + encodeURIComponent(orderId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.found) {
          showStatus(JSON.stringify(d, null, 2), d.approved ? 'ok' : 'err');
          return;
        }
        if (attemptsLeft > 0) {
          showStatus('Waiting for CCBill webhook… (' + attemptsLeft + ' checks left)');
          setTimeout(function () { poll(orderId, attemptsLeft - 1); }, 2500);
        } else {
          showStatus('No webhook received yet for this order. Check Vercel env vars / CCBill webhook config.', 'err');
        }
      })
      .catch(function (e) { showStatus('Network error while polling: ' + e, 'err'); });
  }

  var params = new URLSearchParams(location.search);
  var flag = params.get('ccbill');
  if (flag === 'success' || flag === 'cancelled') {
    history.replaceState({}, document.title, location.pathname);
    var orderId = null;
    try { orderId = localStorage.getItem(ORDER_KEY); } catch (_) {}
    startBtn.classList.add('hidden');
    if (flag === 'cancelled') {
      showStatus('Returned as cancelled/denied.' + (orderId ? ' (orderId: ' + orderId + ')' : ''), 'err');
    } else if (orderId) {
      showStatus('Returned as success. Checking for the webhook result…');
      poll(orderId, 12);
    } else {
      showStatus('Returned as success, but no orderId found in this browser\'s localStorage (maybe a different browser/device than the one that started checkout).', 'err');
    }
  }
})();
</script>
</body>
</html>
