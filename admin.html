<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DEGAJA · ניהול</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{--navy:#17314a;--blue:#398fc2;--gold:#d8a33d;--mist:#eef8fc;--text:#28445b;--muted:#6e8799;--line:#dfeef4;--white:#fff;--red:#c0392b;--green:#1f8a5b}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--text);background:linear-gradient(180deg,#fff 0,#f5fbfe 48%,#fff 100%);min-height:100vh}
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate-card{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(23,49,74,.1);text-align:center}
  .gate-card h1{font-size:20px;color:var(--navy);margin:0 0 6px}
  .gate-card p{color:var(--muted);font-size:13px;margin:0 0 20px}
  .gate-card input{width:100%;padding:13px 14px;border:1px solid #cfe2eb;border-radius:12px;outline:0;font-size:15px;margin-bottom:12px}
  .gate-card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(57,143,194,.12)}
  .gate-card button{width:100%;border:0;border-radius:12px;padding:13px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .gate-err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px}

  #dash{display:none;max-width:1100px;margin:0 auto;padding:24px 18px 60px}
  .dash-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .dash-head h1{font-size:22px;color:var(--navy);margin:0}
  .dash-head .logout{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}

  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .controls select,.controls button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
  .controls button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .controls label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;transition:.3s}
  .live-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(31,138,91,.18)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .card .label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.04em;margin-bottom:6px}
  .card .value{font-size:22px;font-weight:800;color:var(--navy)}
  .card .value small{font-size:12px;color:var(--muted);font-weight:700}
  .card.fee .value{color:var(--red)}
  .card.net .value{color:var(--green)}

  .lang-breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .lang-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--navy)}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:13px}
  th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
  th{background:var(--mist);color:var(--navy);font-size:11px;letter-spacing:.03em}
  tr:last-child td{border-bottom:0}
  td.mono{font-variant-numeric:tabular-nums}
  .empty,.loading,.err{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
  .err{color:var(--red)}
  .table-wrap{overflow-x:auto}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <h1>DEGAJA · ניהול</h1>
    <p>הכנס את קוד הגישה כדי לצפות בתשלומים.</p>
    <input type="password" id="tokenInput" placeholder="קוד גישה" autocomplete="off">
    <button id="loginBtn">כניסה</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="dash">
  <div class="dash-head">
    <h1>תשלומים ורכישות</h1>
    <button class="logout" id="logoutBtn">התנתק</button>
  </div>

  <div class="controls">
    <select id="daysSelect">
      <option value="1">24 שעות אחרונות</option>
      <option value="7" selected>7 ימים אחרונים</option>
      <option value="30">30 ימים אחרונים</option>
      <option value="90">90 ימים אחרונים</option>
    </select>
    <button class="primary" id="refreshBtn">רענן עכשיו</button>
    <label><input type="checkbox" id="liveToggle"><span class="live-dot" id="liveDot"></span> רענון חי (כל 30 שנ׳)</label>
  </div>

  <div class="cards" id="cards"></div>
  <div class="lang-breakdown" id="langBreakdown"></div>

  <div class="table-wrap">
    <table id="table" style="display:none">
      <thead>
        <tr>
          <th>תאריך</th>
          <th>אימייל</th>
          <th>מוצר</th>
          <th>שפה</th>
          <th>ברוטו</th>
          <th>עמלת סטריפ</th>
          <th>נטו</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="loading" id="loadingMsg">טוען…</div>
    <div class="empty" id="emptyMsg" style="display:none">אין רכישות בטווח הזמן הזה.</div>
    <div class="err" id="errMsg" style="display:none"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const TOKEN_KEY = 'degajaAdminToken';

  const FLAGS = { de: '🇩🇪', en: '🇬🇧', fr: '🇫🇷', es: '🇪🇸', it: '🇮🇹', pt: '🇵🇹', ru: '🇷🇺', uk: '🇺🇦', br: '🇧🇷' };
  const PRODUCT_LABELS = {
    single: 'קריאה בודדת',
    pack: '3 קריאות',
  };

  function productLabel(row) {
    if (row.type === 'voice') return `שיחה קולית · ${row.duration || '?'} דק׳`;
    return PRODUCT_LABELS[row.product] || row.product || row.type || '—';
  }

  function money(amount, currency) {
    if (amount == null) return '—';
    const symbol = { eur: '€', usd: '$', gbp: '£', brl: 'R$' }[currency] || (currency ? currency.toUpperCase() + ' ' : '');
    return `${symbol}${(amount / 100).toFixed(2)}`;
  }

  function fmtDate(unixSeconds) {
    const d = new Date(unixSeconds * 1000);
    return d.toLocaleString('he-IL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  let liveTimer = null;

  function showGate(err) {
    $('#gate').style.display = 'flex';
    $('#dash').style.display = 'none';
    $('#gateErr').textContent = err || '';
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  }

  function showDash() {
    $('#gate').style.display = 'none';
    $('#dash').style.display = 'block';
  }

  async function load() {
    const token = sessionStorage.getItem(TOKEN_KEY);
    if (!token) { showGate(); return; }

    $('#loadingMsg').style.display = 'block';
    $('#emptyMsg').style.display = 'none';
    $('#errMsg').style.display = 'none';
    $('#table').style.display = 'none';

    const days = $('#daysSelect').value;
    try {
      const r = await fetch(`/api/admin/payments?days=${encodeURIComponent(days)}`, {
        headers: { 'x-admin-token': token }
      });
      if (r.status === 401) {
        sessionStorage.removeItem(TOKEN_KEY);
        showGate('קוד גישה שגוי.');
        return;
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'שגיאה בטעינת הנתונים');

      renderCards(data.summary);
      renderLangBreakdown(data.summary.byLang);
      renderTable(data.rows);
      $('#loadingMsg').style.display = 'none';
    } catch (e) {
      $('#loadingMsg').style.display = 'none';
      $('#errMsg').textContent = e.message || 'שגיאה בטעינת הנתונים';
      $('#errMsg').style.display = 'block';
    }
  }

  function renderCards(summary) {
    const cards = $('#cards');
    cards.innerHTML = '';
    const countCard = document.createElement('div');
    countCard.className = 'card';
    countCard.innerHTML = `<div class="label">סה״כ רכישות</div><div class="value">${summary.count}</div>`;
    cards.appendChild(countCard);

    const currencies = new Set([
      ...Object.keys(summary.grossByCurrency || {}),
      ...Object.keys(summary.feeByCurrency || {}),
      ...Object.keys(summary.netByCurrency || {})
    ]);

    currencies.forEach(cur => {
      const gross = summary.grossByCurrency[cur] || 0;
      const fee = summary.feeByCurrency[cur] || 0;
      const net = summary.netByCurrency[cur] || 0;
      const grossCard = document.createElement('div');
      grossCard.className = 'card';
      grossCard.innerHTML = `<div class="label">הכנסה ברוטו · ${cur.toUpperCase()}</div><div class="value">${money(gross, cur)}</div>`;
      cards.appendChild(grossCard);

      const feeCard = document.createElement('div');
      feeCard.className = 'card fee';
      feeCard.innerHTML = `<div class="label">עמלת סטריפ · ${cur.toUpperCase()}</div><div class="value">${money(fee, cur)} <small>${gross ? ((fee / gross) * 100).toFixed(1) + '%' : ''}</small></div>`;
      cards.appendChild(feeCard);

      const netCard = document.createElement('div');
      netCard.className = 'card net';
      netCard.innerHTML = `<div class="label">נטו לך · ${cur.toUpperCase()}</div><div class="value">${money(net, cur)}</div>`;
      cards.appendChild(netCard);
    });
  }

  function renderLangBreakdown(byLang) {
    const wrap = $('#langBreakdown');
    wrap.innerHTML = '';
    Object.entries(byLang || {}).sort((a, b) => b[1] - a[1]).forEach(([lang, count]) => {
      const chip = document.createElement('span');
      chip.className = 'lang-chip';
      chip.textContent = `${FLAGS[lang] || '🏳️'} ${lang} · ${count}`;
      wrap.appendChild(chip);
    });
  }

  function renderTable(rows) {
    const tbody = $('#tbody');
    tbody.innerHTML = '';
    if (!rows.length) {
      $('#emptyMsg').style.display = 'block';
      return;
    }
    rows.forEach(row => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="mono">${fmtDate(row.created)}</td>
        <td>${row.email || '—'}</td>
        <td>${productLabel(row)}</td>
        <td>${FLAGS[row.lang] || ''} ${row.lang || '—'}</td>
        <td class="mono">${money(row.amount, row.currency)}</td>
        <td class="mono">${money(row.stripeFee, row.currency)}</td>
        <td class="mono">${money(row.net, row.currency)}</td>
      `;
      tbody.appendChild(tr);
    });
    $('#table').style.display = 'table';
  }

  $('#loginBtn').addEventListener('click', () => {
    const val = $('#tokenInput').value.trim();
    if (!val) return;
    sessionStorage.setItem(TOKEN_KEY, val);
    showDash();
    load();
  });
  $('#tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#loginBtn').click(); });

  $('#logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem(TOKEN_KEY);
    $('#tokenInput').value = '';
    showGate();
  });

  $('#refreshBtn').addEventListener('click', load);
  $('#daysSelect').addEventListener('change', load);

  $('#liveToggle').addEventListener('change', e => {
    const dot = $('#liveDot');
    if (e.target.checked) {
      dot.classList.add('on');
      liveTimer = setInterval(load, 30000);
    } else {
      dot.classList.remove('on');
      if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    }
  });

  if (sessionStorage.getItem(TOKEN_KEY)) {
    showDash();
    load();
  } else {
    showGate();
  }
})();
</script>
</body>
</html>
