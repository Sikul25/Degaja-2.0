name: Load consultation modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip consultation-modules]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy duplicate consultation UI and refresh modules
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          legacy_pattern = re.compile(r'<div class="human-grid">.*?</div>\s*<div class="privacy-note">.*?</div>', re.S)
          text, removed = legacy_pattern.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected to remove one legacy consultation block, removed={removed}')

          text = text.replace('/pre-chat.js?v=1', '/pre-chat.js?v=2')
          text = text.replace('/live-consult.js?v=1', '/live-consult.js?v=2')

          marker = '<script src="script.js"></script>'
          tags = [
              '<script src="/pre-chat.js?v=2"></script>',
              '<script src="/live-consult.js?v=2"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, marker + '\n' + tag, 1)
                  marker = tag
          index.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          old = '''<button class="consult-option" data-duration="15"><span><strong>15 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>${urgent ? "€24,99" : "€19,99"}</b></button>\n          <button class="consult-option" data-duration="30"><span><strong>30 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>${urgent ? "€34,99" : "€29,99"}</b></button>\n          <button class="consult-option" data-duration="60"><span><strong>60 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>${urgent ? "€54,99" : "€49,99"}</b></button>'''
          new = '''<button class="consult-option" data-duration="15"><span><strong>15 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>€29,99</b></button>\n          <button class="consult-option" data-duration="30"><span><strong>30 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>€54,99</b></button>\n          <button class="consult-option" data-duration="60"><span><strong>60 Minuten</strong><small>Persönliches Audio-Gespräch</small></span><b>€99,99</b></button>'''
          if old not in js:
              raise SystemExit('Old consultation price block not found in script.js')
          js = js.replace(old, new, 1)

          old_maps = '''const price = urgent\n      ? ({ "15": "24,99", "30": "34,99", "60": "54,99" }[duration] || "24,99")\n      : ({ "15": "19,99", "30": "29,99", "60": "49,99" }[duration] || "19,99");'''
          new_maps = '''const price = ({ "15": "29,99", "30": "54,99", "60": "99,99" }[duration] || "29,99");'''
          if old_maps not in js:
              raise SystemExit('Old consultation price map not found in script.js')
          js = js.replace(old_maps, new_maps, 1)
          script.write_text(js, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate consultation UI and set live prices [skip consultation-modules]"
          git push
