name: Load consultation modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip consultation-modules]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy duplicate consultation UI and refresh modules
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          legacy_pattern = re.compile(r'<div class="human-grid">.*?</div>\s*<div class="privacy-note">.*?</div>', re.S)
          text, removed = legacy_pattern.subn('', text, count=1)
          if removed != 1:
              raise SystemExit(f'Expected to remove one legacy consultation block, removed={removed}')

          text = text.replace('/pre-chat.js?v=1', '/pre-chat.js?v=2')
          text = text.replace('/live-consult.js?v=1', '/live-consult.js?v=2')

          marker = '<script src="script.js"></script>'
          tags = [
              '<script src="/pre-chat.js?v=2"></script>',
              '<script src="/live-consult.js?v=2"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, marker + '\n' + tag, 1)
                  marker = tag
          index.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          js = js.replace('€54,99', '€59,99')
          js = js.replace('"30": "54,99"', '"30": "59,99"')
          script.write_text(js, encoding='utf-8')

          live = Path('live-consult.js')
          livejs = live.read_text(encoding='utf-8')
          livejs = livejs.replace("30:'54,99'", "30:'59,99'")
          livejs = livejs.replace('30:"54,99"', '30:"59,99"')
          live.write_text(livejs, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js live-consult.js
          git diff --cached --quiet && exit 0
          git commit -m "Set DEGAJA live audio 30 minute price to 59.99 [skip consultation-modules]"
          git push
