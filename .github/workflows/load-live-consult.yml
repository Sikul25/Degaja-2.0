name: Load consultation modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: ${{ !contains(github.event.head_commit.message, '[skip consultation-modules]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject consultation modules
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script src="script.js"></script>'
          if marker not in text:
              raise SystemExit('script.js marker not found')
          tags = [
              '<script src="/pre-chat.js?v=1"></script>',
              '<script src="/live-consult.js?v=1"></script>'
          ]
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, marker + '\n' + tag, 1)
                  marker = tag
          p.write_text(text, encoding='utf-8')
      - name: Commit injection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load preliminary chat and live consultation modules [skip consultation-modules]"
          git push
