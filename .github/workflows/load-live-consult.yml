name: Normalize DEGAJA consultation prices
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prices:
    if: ${{ !contains(github.event.head_commit.message, '[skip consultation-prices]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set live audio prices
        shell: python
        run: |
          from pathlib import Path

          for filename in ('script.js', 'live-consult.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('€54,99', '€59,99')
              text = text.replace('54,99', '59,99')
              path.write_text(text, encoding='utf-8')
      - name: Commit normalized prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js live-consult.js
          git diff --cached --quiet && exit 0
          git commit -m "Normalize DEGAJA live audio prices [skip consultation-prices]"
          git push
