  var lastTopic = "";

  function loadVoice(text, btn){
    btn.disabled = true;
    btn.textContent = t().voice_loading;
    fetchWithTimeout("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, lang: lang })
    }, 20000).then(function(r){ return r.ok ? r.blob() : null; }).then(function(blob){
      if (!blob) { btn.style.display = "none"; return; }
      var url = URL.createObjectURL(blob);
      revealAudio = new Audio(url);
      btn.disabled = false;
      btn.textContent = t().voice_listen;
      revealAudio.addEventListener("ended", function(){
        btn.classList.remove("playing");
        btn.textContent = t().voice_listen;
      });
      btn.addEventListener("click", function(){
        if (revealAudio.paused) {
          revealAudio.play();
          btn.classList.add("playing");
          btn.textContent = t().voice_playing;
        } else {
          revealAudio.pause();
          btn.classList.remove("playing");
          btn.textContent = t().voice_listen;
        }
      });
    }).catch(function(){ btn.style.display = "none"; });
  }

  // Deep-reading upsell, matching the main site's price/wording exactly.
  // On success, CCBill redirects to the homepage; stashing the pending
  // question in the same localStorage key the main site's script.js reads
  // (degajaPendingReading) means it auto-resumes this exact reading there
  // via its existing verifyAiPayment() -> unlockDeepReading() flow. The
  // orderId is stashed the same way (degajaCcbillOrderId) so script.js can
  // poll for this order's webhook result once CCBill redirects back.
  // Guards against a fast double-tap on a price button firing two concurrent
  // /api/checkout calls (two pending CCBill orders before the first redirect).
  var checkoutInFlight = false;

  function startZoharWheelCheckout(product){
    if (checkoutInFlight) return;
    checkoutInFlight = true;
    try {
      localStorage.setItem("degajaPendingReading", JSON.stringify({ question: lastQuestion, topic: lastTopic, source: "zohar-wheel.html" }));
    } catch (_) {}
    fetchWithTimeout("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product: product, birthDate: answers.birthdate, lang: lang, ref: ref })
    }, 20000).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(result){
      if (!result.ok || !result.data.url) throw new Error("checkout failed");
      try { localStorage.setItem("degajaCcbillOrderId", result.data.orderId || ""); } catch (_) {}
      window.location.href = result.data.url;
    }).catch(function(){
      checkoutInFlight = false;
      alert(t().purchase_error);
    });
  }

  function openPurchaseModal(){
    var overlay = document.createElement("div");
    overlay.className = "quiz-modal-overlay";
    overlay.innerHTML =
      '<div class="quiz-modal">' +
        '<div class="eyebrow">' + t().purchase_eyebrow + '</div>' +
        '<h2>' + t().purchase_title + '</h2>' +
        '<p>' + t().purchase_desc + '</p>' +
        '<button class="quiz-modal-btn" id="pmSingle">' + t().purchase_single + '</button>' +
        '<button class="quiz-modal-btn" id="pmPack">' + t().purchase_pack + '</button>' +
        '<div class="quiz-modal-note">' + t().purchase_note + '</div>' +
        '<button class="quiz-modal-close" id="pmClose">' + t().purchase_back + '</button>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    document.getElementById("pmClose").addEventListener("click", function(){ overlay.remove(); });
    document.getElementById("pmSingle").addEventListener("click", function(){ startZoharWheelCheckout("single"); });
    document.getElementById("pmPack").addEventListener("click", function(){ startZoharWheelCheckout("pack"); });
  }

  // Cross-links to the other 6 standalone feature pages, plus home.
  function crossLinksHtml(){
    return '<div class="quiz-cross-links"><div class="quiz-cross-heading">' + t().cross_heading + '</div><div class="quiz-cross-grid">' +
      '<a href="index.html">' + t().cross_home + '</a>' +
      '<a href="dream.html">' + t().cross_dream + '</a>' +
      '<a href="quiz.html">' + t().cross_quiz + '</a>' +
      '<a href="love-quiz.html">' + t().cross_love + '</a>' +
      '<a href="time-tunnel.html">' + t().cross_time + '</a>' +
      '<a href="aura.html">' + t().cross_aura + '</a>' +
      '<a href="mind-clinic.html">' + t().cross_mindclinic + '</a>' +
      '</div></div>';
  }

  function legalLinksHtml(){
    var l = t().legal || {};
    return '<div class="quiz-legal-links">' +
      '<a href="impressum.html" target="_blank" rel="noopener">' + (l.impressum || "Impressum") + '</a> · ' +
      '<a href="datenschutz.html" target="_blank" rel="noopener">' + (l.datenschutz || "Datenschutz") + '</a> · ' +
      '<a href="agb.html" target="_blank" rel="noopener">' + (l.agb || "AGB") + '</a> · ' +
      '<a href="widerruf.html" target="_blank" rel="noopener">' + (l.widerruf || "Widerruf") + '</a>' +
      '</div>';
  }

  // Web Share API where available (mobile browsers, mostly), clipboard-copy
  // fallback otherwise (desktop). This is the free result's only viral
  // growth lever on this page.
  function bindShareButton(){
    var btn = document.getElementById("shareBtn");
    if (!btn) return;
    btn.addEventListener("click", function(){
      var shareData = { title: "DEGAJA", text: t().share_text, url: location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(function(){});
        return;
      }
      var status = document.getElementById("shareStatus");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareData.text + " " + shareData.url).then(function(){
          if (status) { status.textContent = t().share_copied; setTimeout(function(){ status.textContent = ""; }, 2500); }
        }).catch(function(){});
      }
    });
  }

  function renderReveal(text, paid){
    var html = '<div class="quiz-reveal-top"><div class="quiz-reveal-badge">' + (paid ? t().paid_badge : t().reveal_badge) + '</div>';
    html += '<button class="quiz-voice-btn" id="voiceBtn" disabled>' + t().voice_loading + '</button></div>';
    html += '<div class="quiz-reveal-card"><div class="quiz-reveal-text" id="revealText"></div></div>';
    html += '<button class="quiz-share-btn" id="shareBtn" type="button">' + t().share_btn + '</button>';
    html += '<div class="quiz-share-status" id="shareStatus" aria-live="polite"></div>';
    if (!paid) {
      html += '<button class="quiz-cta" id="ctaBtn">' + t().cta + '</button>';
      html += '<div class="quiz-pack-hint" role="button" tabindex="0">' + t().purchase_pack + '</div>';
      html += '<div class="quiz-trust-note">🔒 ' + t().purchase_note + '</div>';
    }
    html += '<div class="quiz-disclaimer">' + t().disclaimer + '</div>';
    html += crossLinksHtml();
    html += legalLinksHtml();
    setCard(html);
    typewriter(document.getElementById("revealText"), text);
    loadVoice(text, document.getElementById("voiceBtn"));
    bindShareButton();
    if (paid) return;
    document.getElementById("ctaBtn").addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    var packHint = document.querySelector(".quiz-pack-hint");
    packHint.addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
    packHint.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (revealAudio) revealAudio.pause(); openPurchaseModal(); }
    });
  }

  function finishLoadingBar(){
    clearInterval(loadingTimer);
    var pctEl = document.getElementById("loadPct");
    if (pctEl) pctEl.textContent = "100%";
  }

  // Plain fetch() with no timeout meant a hung AI response (slow backend,
  // flaky mobile network) left the loading screen stuck at ~96% forever -
  // no error, no fallback, nothing the visitor could do but close the page.
  // Aborts after ms and falls through to the caller's fallback reading text.
  function fetchWithTimeout(url, opts, ms){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, ms);
    opts = opts || {};
    opts.signal = controller.signal;
    return fetch(url, opts).then(function(r){ clearTimeout(timer); return r; }, function(e){ clearTimeout(timer); throw e; });
  }

  function runReveal(){
    updateProgress(100);
    renderLoading(t().loading_phrases);
    var question = REVEAL_PROMPT[lang]
      .replace("{name}", answers.name)
      .replace("{birthdate}", answers.birthdate)
      .replace("{symbol}", answers.theme.name)
      .replace("{meaning}", t().zohar_suffix)
      .replace("{focus}", answers.focus);
    lastQuestion = question;
    lastTopic = REVEAL_TOPIC[lang];

    var minWait = new Promise(function(resolve){ setTimeout(resolve, 3200); });
    var request = fetchWithTimeout("/api/oracle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        topic: REVEAL_TOPIC[lang],
        mode: "paid",
        lang: lang
      })
    }, 45000).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

    Promise.all([request, minWait]).then(function(results){
      finishLoadingBar();
      var data = results[0];
      var text = (data && data.text) ? data.text : t().reveal_fallback;
      setTimeout(function(){ renderReveal(text); }, 260);
    });
  }

  // After a real CCBill payment, script.js's verifyAiPayment() (on the
  // homepage, where CCBill's redirect always lands) sends the browser back
  // here with the pending question still in degajaPendingReading, rather
  // than rendering the paid reading itself - so the person lands back on
  // the exact page they bought from, not on the homepage's Oracle section.
  // Re-asks the same question in paid mode (a fresh AI answer, same prompt
  // shape as the free reveal above) and shows it directly, skipping the quiz.
  function resumePaidReading(pending){
    lastQuestion = pending.question;
    lastTopic = pending.topic || "";
    renderLoading(t().loading_phrases);
    var minWait = new Promise(function(resolve){ setTimeout(resolve, 1200); });
    var request = fetchWithTimeout("/api/oracle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: pending.question, topic: pending.topic || "", mode: "paid", lang: lang })
    }, 45000).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

    Promise.all([request, minWait]).then(function(results){
      finishLoadingBar();
      var data = results[0];
      var text = (data && data.text) ? data.text : t().reveal_fallback;
      setTimeout(function(){ renderReveal(text, true); }, 260);
    });
  }

  var resumedPending = null;
  try { resumedPending = JSON.parse(localStorage.getItem("degajaPendingReading") || "null"); } catch (_) {}
  if (resumedPending && resumedPending.question && resumedPending.source === "zohar-wheel.html") {
    try { localStorage.removeItem("degajaPendingReading"); } catch (_) {}
    resumePaidReading(resumedPending);
  } else {
    render();
    applyGeoLangIfEligible();
  }
})();
</script>
