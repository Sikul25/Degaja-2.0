  "ru": "Меня зовут {name}, я родился(лась) {birthdate}. Часть моей временной линии, которая зовёт меня сильнее всего: {insight}. Что я хочу, чтобы тоннель мне открыл: {focus}. Используй мою дату рождения как зерно, которое помещает отголосок моего прошлого в конкретную точку где-то за последние 3000 лет человеческой истории — выбери конкретную эпоху, обстановку и место, не оставаясь расплывчатым насчёт того, когда и где. Напиши мне живое, захватывающее личное путешествие сквозь мою собственную временную линию — не общее предсказание. Используй моё имя напрямую и проведи меня через три ярких момента: отголосок моего прошлого, который до сих пор формирует меня, ясную правду о том, где я действительно нахожусь сейчас, и проблеск того, что формируется впереди — сплетая все три в единую нить, связанную с моим выбором. Постепенно наращивай предвкушение на протяжении 7-9 предложений, и заверши запоминающейся, слегка незавершённой нотой, которая вызывает желание узнать больше. Напиши это так, будто ты ведёшь меня через проход, который должен пройти только я — интимно, кинематографично, никогда не обобщённо и не второпях. Подай это как рефлексивное развлечение, никогда как гарантированное предсказание.",
  "uk": "Мене звати {name}, я народився(лася) {birthdate}. Частина моєї часової лінії, яка кличе мене найсильніше: {insight}. Що я хочу, щоб тунель мені відкрив: {focus}. Використай мою дату народження як зерно, яке розміщує відлуння мого минулого в конкретній точці десь протягом останніх 3000 років людської історії — обери конкретну епоху, обстановку і місце, не залишаючись розпливчастим щодо того, коли і де. Напиши мені живу, захопливу особисту подорож крізь мою власну часову лінію — не загальне передбачення. Використай моє ім'я напряму і проведи мене крізь три яскраві моменти: відлуння мого минулого, яке досі формує мене, ясну правду про те, де я насправді зараз перебуваю, і погляд на те, що формується попереду — сплітаючи всі три в єдину нитку, пов'язану з моїм вибором. Поступово нарощуй передчуття протягом 7-9 речень, і заверши пам'ятною, трохи незавершеною нотою, яка викликає бажання дізнатися більше. Напиши це так, ніби ти ведеш мене крізь прохід, яким маю пройти лише я — інтимно, кінематографічно, ніколи узагальнено чи поспішно. Подай це як рефлексивну розвагу, ніколи як гарантоване передбачення.",
  "ja": "私の名前は{name}、{birthdate}生まれです。私の時間軸の中で最も私を呼んでいる部分：{insight}。トンネルに明らかにしてほしいこと：{focus}。私の生年月日を種として使い、私の過去の残響を人類史の直近3000年のどこか具体的な一点に位置づけてください——いつ、どこかについて曖昧にせず、具体的な時代、情景、場所を一つ決めてください。一般的な予言ではなく、私自身の時間軸を巡る臨場感あふれる個人的な旅を書いてください。私の名前を直接使い、3つの鮮やかな瞬間を通して私を導いてください——今も私を形作っている過去の残響、今本当にいる場所についての明確な真実、そしてこの先に形作られつつあるものの一瞬の予感——これら3つを、私が選んだものと結びつけながら一本の糸として織り上げてください。7〜9文かけて徐々に期待感を高め、もっと知りたくなるような、余韻の残る少し未完結な一文で締めくくってください。まるで私だけが通るべき通路を導いているかのように——親密で、映画のように鮮やかで、決して一般的で急いだものにならないように書いてください。これは内省的なエンターテインメントとして提示し、保証された予言としては決して提示しないでください。",
  "zh": "我叫{name}，出生于{birthdate}。我的时间线中最吸引我的部分：{insight}。我希望隧道为我揭示的内容：{focus}。把我的出生日期当作一颗种子，用它将我的过去回响定位在人类历史最近3000年中的某个具体时间点——请选定一个具体的时代、场景和地点，不要在何时何地的问题上含糊其辞。请为我写一段身临其境、生动的个人旅程，穿越我自己的时间线——不要是千篇一律的预言。直接使用我的名字，带我穿越三个生动的瞬间：一个至今仍在塑造我的过去回响，一个关于我现在真正所处位置的清晰真相，以及一瞥正在前方成形的事物——将这三者编织成一条线索，与我的选择紧密相连。用7到9句话逐步营造期待感，并以一个令人回味、略带悬念的结尾收束，让我想知道更多。写得就像你在引导我走过一段只有我才能走的通道一样——亲密、如电影般生动，绝不千篇一律或仓促。请将其呈现为反思性的娱乐内容，绝不是确定的预言。",
  "hi": "मेरा नाम {name} है, मेरा जन्म {birthdate} को हुआ था। मेरी टाइमलाइन का वह हिस्सा जो मुझे सबसे ज़्यादा बुलाता है: {insight}। मैं चाहता/चाहती हूं कि सुरंग मुझे क्या दिखाए: {focus}। मेरी जन्मतिथि को एक बीज की तरह इस्तेमाल करें, जो मेरे अतीत की गूंज को पिछले 3000 वर्षों के मानव इतिहास में कहीं एक खास बिंदु पर रखे — कब और कहाँ के बारे में अस्पष्ट रहने के बजाय एक ठोस युग, परिवेश और स्थान तय करें। मुझे मेरी अपनी टाइमलाइन के पार एक गहन, जीवंत व्यक्तिगत यात्रा लिखें — कोई सामान्य भविष्यवाणी नहीं। मेरे नाम का सीधे इस्तेमाल करें, और मुझे तीन जीवंत पलों से होकर ले जाएं: मेरे अतीत की एक गूंज जो आज भी मुझे आकार दे रही है, इस बारे में एक स्पष्ट सच्चाई कि मैं अभी वास्तव में कहां खड़ा/खड़ी हूं, और आगे बन रही किसी चीज़ की एक झलक — इन तीनों को एक ही धागे में बुनते हुए, मेरी पसंद से जोड़ते हुए। 7-9 वाक्यों में धीरे-धीरे उत्सुकता बढ़ाएं, और एक यादगार, थोड़े अधूरे अंदाज़ में खत्म करें जिससे मुझे और जानने की इच्छा हो। इसे ऐसे लिखें जैसे आप मुझे एक ऐसे रास्ते से गुज़ार रहे हों जो सिर्फ मुझे ही पार करना है — आत्मीय, सिनेमाई, कभी भी सामान्य या जल्दबाज़ी वाला नहीं। इसे चिंतनशील मनोरंजन के रूप में प्रस्तुत करें, कभी भी गारंटीशुदा भविष्यवाणी के रूप में नहीं।"
};

  var qs = new URLSearchParams(location.search);
  var requestedLang = qs.get("lang");
  var mappedLang = LANG_ALIAS[requestedLang] || requestedLang;
  var langWasExplicit = SUPPORTED_LANGS.indexOf(mappedLang) !== -1;
  // Fall back to the main site's own remembered language (same localStorage
  // key as i18n.js) before falling back to German/geo-guessing — covers a
  // direct visit, a bookmark, or an old cached banner link with no ?lang=.
  var storedLang = null;
  try {
    var storedRaw = localStorage.getItem("degajaLang");
    var storedMapped = LANG_ALIAS[storedRaw] || storedRaw;
    if (SUPPORTED_LANGS.indexOf(storedMapped) !== -1) storedLang = storedMapped;
  } catch (_) {}
  var lang = langWasExplicit ? mappedLang : (storedLang || "de");
  langWasExplicit = langWasExplicit || !!storedLang;
  var ref = qs.get("ref") || qs.get("utm_source") || "time-tunnel";

  // Same spirit as i18n.js on the main site: a real visitor-country guess
  // from Vercel's edge (see /api/geo.js) beats a hardcoded default — but
  // never overrides an explicit ?lang= pick, and only applies while still
  // on the first question so it can't disrupt someone mid-quiz.
  var COUNTRY_LANG = {
    DE: "de", AT: "de", CH: "de", LI: "de",
    FR: "fr", MC: "fr",
    ES: "es", AR: "es", CO: "es", CL: "es", PE: "es", MX: "es", VE: "es",
    IT: "it",
    PT: "pt", BR: "pt",
    RU: "ru", BY: "ru", KZ: "ru", UA: "ru",
    GB: "en", IE: "en", US: "en", CA: "en", AU: "en", NZ: "en", ZA: "en", SG: "en",
    JP: "ja", CN: "zh", TW: "zh", HK: "zh", MO: "zh",
    IN: "hi"
  };
  function applyGeoLangIfEligible(){
    if (langWasExplicit) return;
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 2500);
    fetch("/api/geo", { signal: controller.signal })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(data){
        clearTimeout(timeout);
        // Re-check here, not just on entry: the quiz may have advanced past
        // step 1, or the visitor may have picked a language manually, while
        // this request was in flight. Applying the detected language to
        // whatever step they're now on (via render()) still beats leaving
        // them stuck on the German default for the rest of the quiz.
        if (langWasExplicit) return;
        var geoLang = data && COUNTRY_LANG[String(data.country || "").toUpperCase()];
        if (!geoLang || geoLang === lang) return;
        lang = geoLang;
        langSelect.value = lang;
        render();
      })
      .catch(function(){});
  }

  var answers = { insight: null, birthdate: "", name: "", focus: null };
  var step = 1;
  var TOTAL_STEPS = 4;
  var loadingTimer = null;
  var typeTimer = null;

  var card = document.getElementById("quizCard");
  var progressBar = document.getElementById("progressBar");
  var stepCount = document.getElementById("stepCount");
  var langSelect = document.getElementById("langSelect");

  function t(){ return STR[lang]; }

  function buildStars(){
    var wrap = document.getElementById("stars");
    wrap.innerHTML = "";
    var count = window.innerWidth < 500 ? 36 : 60;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("div");
      s.className = "quiz-star";
      var size = (Math.random() * 1.8 + 0.6).toFixed(1);
      s.style.width = size + "px";
      s.style.height = size + "px";
      s.style.left = (Math.random() * 100) + "%";
      s.style.top = (Math.random() * 100) + "%";
      s.style.animationDuration = (2 + Math.random() * 3).toFixed(1) + "s";
      s.style.animationDelay = (Math.random() * 3).toFixed(1) + "s";
      wrap.appendChild(s);
    }
  }
  buildStars();

  langSelect.value = lang;
  langSelect.addEventListener("change", function(){
    lang = langSelect.value;
    langWasExplicit = true;
    render();
  });

  function updateProgress(pctOverride){
    var pct = pctOverride != null ? pctOverride : Math.min(100, Math.round((step - 1) / TOTAL_STEPS * 100) + 8);
    progressBar.style.width = pct + "%";
    stepCount.textContent = Math.min(step, TOTAL_STEPS) + "/" + TOTAL_STEPS;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function setCard(html){
    card.classList.remove("quiz-anim");
    card.innerHTML = html;
    void card.offsetWidth;
    card.classList.add("quiz-anim");
  }

  function renderOptionsStep(eyebrow, h1, opts, onPick){
    var html = '<div class="quiz-eyebrow">' + eyebrow + '</div>';
    html += '<h1 class="quiz-h1">' + h1 + '</h1>';
    html += '<div class="quiz-options">';
    opts.forEach(function(o, i){
      html += '<button class="quiz-opt" data-i="' + i + '"><span class="ic">' + o.ic + '</span>' + escapeHtml(o.t) + '<span class="arrow">→</span></button>';
    });
    html += '</div>';
    if (step > 1) html += '<button class="quiz-back" id="backBtn">' + t().back + '</button>';
    setCard(html);
    Array.prototype.forEach.call(card.querySelectorAll(".quiz-opt"), function(btn){
      btn.addEventListener("click", function(){
        if (card.dataset.locked) return;
        card.dataset.locked = "1";
        btn.classList.add("picked");
        setTimeout(function(){ onPick(opts[Number(btn.dataset.i)]); }, 260);
      });
    });
    var backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", goBack);
  }

  function renderInputStep(eyebrow, h1, placeholder, type, onNext, currentValue){
    var html = '<div class="quiz-eyebrow">' + eyebrow + '</div>';
    html += '<h1 class="quiz-h1">' + h1 + '</h1>';
    html += '<input class="quiz-input" id="stepInput" type="' + type + '" placeholder="' + placeholder + '" value="' + escapeHtml(currentValue || "") + '">';
    html += '<button class="quiz-cta" id="nextBtn">' + t().next + '</button>';
    html += '<button class="quiz-back" id="backBtn">' + t().back + '</button>';
    setCard(html);
    var input = document.getElementById("stepInput");
    var nextBtn = document.getElementById("nextBtn");
    input.focus();
    function tryNext(){
      var val = input.value.trim();
      if (!val) { input.style.borderColor = "#e35b5b"; return; }
      onNext(val);
    }
    nextBtn.addEventListener("click", tryNext);
    input.addEventListener("keydown", function(e){ if (e.key === "Enter") tryNext(); });
    document.getElementById("backBtn").addEventListener("click", goBack);
  }

  function goBack(){
    if (step > 1) { step -= 1; render(); }
  }

  function render(){
    delete card.dataset.locked;
    document.documentElement.lang = lang;
    updateProgress();
    if (step === 1) {
      renderOptionsStep(t().q1_eyebrow, t().q1_h1, t().q1_opts, function(opt){
        answers.insight = opt.t;
        step = 2; render();
      });
    } else if (step === 2) {
      renderInputStep(t().q2_eyebrow, t().q2_h1, t().q2_placeholder, "date", function(val){
        answers.birthdate = val;
        step = 3; render();
      }, answers.birthdate);
    } else if (step === 3) {
      renderInputStep(t().q3_eyebrow, t().q3_h1, t().q3_placeholder, "text", function(val){
        answers.name = val;
        step = 4; render();
      }, answers.name);
    } else if (step === 4) {
      renderOptionsStep(t().q4_eyebrow, t().q4_h1, t().q4_opts, function(opt){
        answers.focus = opt.t;
        runReveal();
      });
    }
  }

  function renderLoading(phrases){
    phrases = phrases || t().loading_phrases;
    var html = '<div class="quiz-loading">';
    html += '<div class="quiz-orb-wrap"><div class="quiz-orb-ring"></div><div class="quiz-orb-ring r2"></div><div class="quiz-orb"></div></div>';
    html += '<div class="quiz-loading-pct" id="loadPct">0%</div>';
    html += '<div><div class="quiz-loading-title" id="loadTitle">' + phrases[0] + '</div>';
    html += '<div class="quiz-loading-sub">' + t().loading_sub + '</div></div>';
    html += '</div>';
    setCard(html);

    var pctEl = document.getElementById("loadPct");
    var titleEl = document.getElementById("loadTitle");
    var pct = 0, phraseIdx = 0;
    clearInterval(loadingTimer);
    loadingTimer = setInterval(function(){
      pct = Math.min(96, pct + Math.round(4 + Math.random() * 9));
      pctEl.textContent = pct + "%";
      var nextPhrase = Math.floor(pct / (100 / phrases.length));
      if (nextPhrase !== phraseIdx && nextPhrase < phrases.length) {
        phraseIdx = nextPhrase;
        titleEl.style.opacity = 0;
        setTimeout(function(){ titleEl.textContent = phrases[phraseIdx]; titleEl.style.opacity = 1; }, 220);
      }
    }, 260);
  }

  function typewriter(el, text, done){
    clearInterval(typeTimer);
    var i = 0;
    el.innerHTML = '<span class="cursor"></span>';
    typeTimer = setInterval(function(){
      i += 2;
      el.innerHTML = escapeHtml(text.slice(0, i)) + '<span class="cursor"></span>';
      if (i >= text.length) {
        clearInterval(typeTimer);
        el.innerHTML = escapeHtml(text);
        if (done) done();
      }
    }, 18);
  }

  var revealAudio = null;
  var lastQuestion = "";
  var lastTopic = "";

  function loadVoice(text, btn){
    btn.disabled = true;
    btn.textContent = t().voice_loading;
    fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, lang: lang })
    }).then(function(r){ return r.ok ? r.blob() : null; }).then(function(blob){
      if (!blob) { btn.style.display = "none"; return; }
      var url = URL.createObjectURL(blob);
      revealAudio = new Audio(url);
      btn.disabled = false;
      btn.textContent = t().voice_listen;
      revealAudio.addEventListener("ended", function(){
        btn.classList.remove("playing");
        btn.textContent = t().voice_listen;
      });
      btn.addEventListener("click", function(){
        if (revealAudio.paused) {
          revealAudio.play();
          btn.classList.add("playing");
          btn.textContent = t().voice_playing;
        } else {
          revealAudio.pause();
          btn.classList.remove("playing");
          btn.textContent = t().voice_listen;
        }
      });
    }).catch(function(){ btn.style.display = "none"; });
  }

  // Deep-reading upsell, matching the main site's price/wording exactly.
  // On success, Stripe redirects to the homepage; stashing the pending
  // question in the same localStorage key the main site's script.js reads
  // (degajaPendingReading) means it auto-resumes this exact reading there
  // via its existing verifyAiPayment() -> unlockDeepReading() flow.
  function startTimeTunnelCheckout(product){
    try {
      localStorage.setItem("degajaPendingReading", JSON.stringify({ question: lastQuestion, topic: lastTopic }));
    } catch (_) {}
    fetch("/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ product: product, birthDate: answers.birthdate, lang: lang, ref: ref })
    }).then(function(r){
      return r.json().then(function(data){ return { ok: r.ok, data: data }; });
    }).then(function(result){
      if (!result.ok || !result.data.url) throw new Error("checkout failed");
      window.location.href = result.data.url;
    }).catch(function(){
      alert(t().purchase_error);
    });
  }

  function openPurchaseModal(){
    var overlay = document.createElement("div");
    overlay.className = "quiz-modal-overlay";
    overlay.innerHTML =
      '<div class="quiz-modal">' +
        '<div class="eyebrow">' + t().purchase_eyebrow + '</div>' +
        '<h2>' + t().purchase_title + '</h2>' +
        '<p>' + t().purchase_desc + '</p>' +
        '<button class="quiz-modal-btn" id="pmSingle">' + t().purchase_single + '</button>' +
        '<button class="quiz-modal-btn" id="pmPack">' + t().purchase_pack + '</button>' +
        '<div class="quiz-modal-note">' + t().purchase_note + '</div>' +
        '<button class="quiz-modal-close" id="pmClose">' + t().purchase_back + '</button>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    document.getElementById("pmClose").addEventListener("click", function(){ overlay.remove(); });
    document.getElementById("pmSingle").addEventListener("click", function(){ startTimeTunnelCheckout("single"); });
    document.getElementById("pmPack").addEventListener("click", function(){ startTimeTunnelCheckout("pack"); });
  }

  function legalLinksHtml(){

    return '<div class="quiz-legal-links">' +
      '<a href="impressum.html" target="_blank" rel="noopener">' + (l.impressum || "Impressum") + '</a> · ' +
      '<a href="datenschutz.html" target="_blank" rel="noopener">' + (l.datenschutz || "Datenschutz") + '</a> · ' +
      '<a href="agb.html" target="_blank" rel="noopener">' + (l.agb || "AGB") + '</a> · ' +
      '<a href="widerruf.html" target="_blank" rel="noopener">' + (l.widerruf || "Widerruf") + '</a>' +

  function renderReveal(text){
    var html = '<div class="quiz-reveal-top"><div class="quiz-reveal-badge">' + t().reveal_badge + '</div>';
    html += '<button class="quiz-voice-btn" id="voiceBtn" disabled>' + t().voice_loading + '</button></div>';
    html += '<div class="quiz-reveal-card"><div class="quiz-reveal-text" id="revealText"></div></div>';
    html += '<button class="quiz-cta" id="ctaBtn">' + t().cta + '</button>';
    html += '<div class="quiz-pack-hint">' + t().purchase_pack + '</div>';
    html += '<div class="quiz-trust-note">🔒 ' + t().purchase_note + '</div>';
    html += '<div class="quiz-disclaimer">' + t().disclaimer + '</div>';
    html += legalLinksHtml();
    setCard(html);
    typewriter(document.getElementById("revealText"), text);
    loadVoice(text, document.getElementById("voiceBtn"));
    document.getElementById("ctaBtn").addEventListener("click", function(){
      if (revealAudio) revealAudio.pause();
      openPurchaseModal();
    });
  }

  function finishLoadingBar(){
    clearInterval(loadingTimer);
    var pctEl = document.getElementById("loadPct");
    if (pctEl) pctEl.textContent = "100%";
  }

  function runReveal(){
    updateProgress(100);
    renderLoading(t().loading_phrases);
    var question = REVEAL_PROMPT[lang]
      .replace("{name}", answers.name)
      .replace("{birthdate}", answers.birthdate)
      .replace("{insight}", answers.insight)
      .replace("{focus}", answers.focus);
    lastQuestion = question;
    lastTopic = REVEAL_TOPIC[lang];

    var minWait = new Promise(function(resolve){ setTimeout(resolve, 3200); });
    var request = fetch("/api/oracle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: question,
        topic: REVEAL_TOPIC[lang],
        mode: "paid",
        lang: lang
      })
    }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

    Promise.all([request, minWait]).then(function(results){
      finishLoadingBar();
      var data = results[0];
      var text = (data && data.text) ? data.text : t().reveal_fallback;
      setTimeout(function(){ renderReveal(text); }, 260);
    });
  }

  render();
  applyGeoLangIfEligible();
})();
</script>
</body>
</html>
